name: Clean merged development branches

on:
  workflow_run:
    workflows: [Reproducibility checks]
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branches = ['feature/upload-documents-ocr', 'fix/document-upload-lifecycle'];
            for (const branch of branches) {
              let ref;
              try {
                ref = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch})).data;
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              const sha = ref.object.sha;
              const comparison = (await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: 'main...' + sha
              })).data;
              if (!['behind', 'identical'].includes(comparison.status)) {
                core.warning('Keeping unmerged branch: ' + branch);
                continue;
              }
              const current = (await github.rest.git.getRef({
                owner, repo, ref: 'heads/' + branch
              })).data;
              if (current.object.sha !== sha) {
                core.warning('Branch changed during verification: ' + branch);
                continue;
              }
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + branch});
              core.info('Deleted fully merged branch: ' + branch);
            }
